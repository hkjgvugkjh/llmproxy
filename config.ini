[models]
; 格式: 模型名称 = API密钥|上游地址|上游模型名
; 示例:
; gpt-4o = sk-your-key|https://api.openai.com/v1|gpt-4o
; claude-sonnet-4 = sk-your-key|https://api.anthropic.com/v1|claude-sonnet-4-20250514
your-model = YOUR_API_KEY|YOUR_BASE_URL|YOUR_MODEL_NAME

[proxy]
; 监听地址和端口
host = 0.0.0.0
port = 8000

[auth]
; 设置后客户端需在 Authorization 头中携带此密钥
; 留空则不校验
proxy_api_key =
